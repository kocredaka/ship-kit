[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# Public Avalanche RPC endpoints (no API key needed for reads).
# Override with your own endpoint in .env when deploying for real.
[rpc_endpoints]
fuji = "https://api.avax-test.network/ext/bc/C/rpc"
cchain = "https://api.avax.network/ext/bc/C/rpc"

# Snowtrace contract verification (needs a free Snowtrace API key).
[etherscan]
fuji = { key = "${SNOWTRACE_API_KEY}", url = "https://api-testnet.snowtrace.io/api", chain = 43113 }
cchain = { key = "${SNOWTRACE_API_KEY}", url = "https://api.snowtrace.io/api", chain = 43114 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
